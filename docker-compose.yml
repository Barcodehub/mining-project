volumes:
  prometheus_data: {}
  grafana_data: {}
  influxdb_data: {}
  postgres_data: {}
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 5s
      timeout: 5s
      retries: 30
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: on-failure
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mining_notifications
  postgres-audit:
    image: postgres:15
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./observability/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  prometheus:
    image: prom/prometheus:v2.47.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
  grafana:
    image: grafana/grafana:10.1.5
    ports:
      - "4000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
    volumes:
      - influxdb_data:/var/lib/influxdb
  mining-audit-notifications:
    build:
      context: ./mining-audit-notifications
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ALERT_RECIPIENTS: "1"
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      postgres-audit:
        condition: service_healthy
      mongo:
        condition: service_started
  mining-management:
    build:
      context: ./mining-management
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      MINING_USERS_URL: http://mining-users:8081
      MINING_AUDIT_NOTIFICATIONS_URL: http://mining-audit-notifications:8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_BLOCK_MS: 5000
      PSEUDONYM_SECRET: ${PSEUDONYM_SECRET:-dev-only-pseudonym-secret}
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      postgres-audit:
        condition: service_healthy
  mining-users:
    build:
      context: ./mining-users
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_DATA_LOCATIONS: classpath:db/init-roles.sql
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
    restart: on-failure
    depends_on:
      postgres-audit:
        condition: service_healthy
  k6:
    image: grafana/k6:0.54.0
    volumes:
      - ./evaluacion/k6:/k6
      - ./evaluacion/results:/results
    entrypoint: ["k6", "run", "/k6/load_test.js"]
    depends_on:
      - influxdb
    environment:
      - K6_INFLUXDB_ADDR=http://influxdb:8086/k6
