spring:
  application:
    name: mining-management
  config:
    import: optional:classpath:config-ambiental.yaml
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres-audit:5432/mining_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: caffeine
server:
  port: ${SERVER_PORT:8082}


mining:
  users:
    url: ${MINING_USERS_URL:http://mining-users:8081}
  audit-notifications:
    url: ${MINING_AUDIT_NOTIFICATIONS_URL:http://mining-audit-notifications:8083}

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGeneration}


aws:
  s3:
    region: us-east-1
    bucketName: tu-bucket
    accessKeyId: TU_ACCESS_KEY
    secretAccessKey: TU_SECRET_KEY

# Protección del reportante
privacidad:
  seudonimo:
    secreto: ${PSEUDONYM_SECRET:change-me-in-production}
  reportes:
    cuadricula-grados: ${REPORT_GRID_DEGREES:0.01}
    roles-precisos: ADMINISTRADOR,MODERADOR
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true
