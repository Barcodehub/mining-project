server:
  port: ${SERVER_PORT:8080}

mining:
  users:
    url: ${MINING_USERS_URL:http://localhost:8081}
  audit-notifications:
    url: ${MINING_AUDIT_NOTIFICATIONS_URL:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGeneration}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mining-management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: caffeine

aws:
  s3:
    region: us-east-1
    bucketName: tu-bucket
    accessKeyId: TU_ACCESS_KEY
    secretAccessKey: TU_SECRET_KEY


  # Actuator & Prometheus Configuration
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: "${spring.application.name}"
    distribution:
      percentiles-histogram:
        http.server.requests: true
