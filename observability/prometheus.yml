global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: 'mining-management'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['mining-management:8082']
  - job_name: 'mining-users'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['mining-users:8081']
  - job_name: 'mining-audit-notifications'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['mining-audit-notifications:8083']
